# Publishes each GitHub release to Nexus Mods: the release's ApexRadiance.asi, zipped, becomes a new version of the
# existing file on the Nexus mod page (official action Nexus-Mods/upload-action, Nexus upload API v3).
#
# One-time setup (repository Settings > Secrets and variables > Actions):
#   secret   NEXUSMODS_API_KEY  the Nexus API key (Nexus Mods > your account > API keys)
#   variable NEXUS_FILE_ID      the number of any version of the mod's main file (v1 API / Files tab "Advanced"; e.g. 590)
#   variable NEXUS_MOD_ID       the number in the mod page URL (e.g. 247); both are turned into v3 ids at run time
# Without them the job is skipped.
name: Upload to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. v1.4.8)"
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    if: ${{ vars.NEXUS_FILE_ID != '' }}
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download the release's ApexRadiance.asi and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern ApexRadiance.asi --dir dist
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          {
            echo "CHANGELOG<<APEX_EOF"
            bash .github/scripts/nexus-changelog.sh < notes.md # plain lines for the Nexus changelog
            echo "APEX_EOF"
          } >> "$GITHUB_ENV"

      - name: Zip
        run: |
          cd dist
          zip -9 "../ApexRadiance-$VERSION.zip" ApexRadiance.asi

      # The upload API (v3) names the mod and its file by their v3 ids, not by the numbers the site and the v1 API show
      # (mod 247, file 590): look them up from those numbers
      - name: Resolve the Nexus v3 ids
        env:
          NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          GAME: ${{ vars.NEXUS_GAME || 'thesims3' }}
        run: |
          api() { curl -sS -f -H "apikey: $NEXUS_KEY" -H "User-Agent: loinyx/Sims3-ApexRadiance" "https://api.nexusmods.com/v3$1"; }
          FILE=$(api "/games/$GAME/mod-file-versions/${{ vars.NEXUS_FILE_ID }}" | jq -r '.data.file.id // empty')
          MOD=$(api "/games/$GAME/mods/${{ vars.NEXUS_MOD_ID }}" | jq -r '.data.id // empty')
          if [ -z "$FILE" ]; then echo "::error::Could not find the v3 id of Nexus file ${{ vars.NEXUS_FILE_ID }}"; exit 1; fi
          echo "Nexus v3 ids: file $FILE, mod ${MOD:-unknown}"
          echo "V3_FILE_ID=$FILE" >> "$GITHUB_ENV"
          echo "V3_MOD_ID=$MOD" >> "$GITHUB_ENV"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ env.V3_FILE_ID }}
          mod_id: ${{ env.V3_MOD_ID }}
          filename: ApexRadiance-${{ env.VERSION }}.zip
          version: ${{ env.VERSION }}
          display_name: Apex Radiance ${{ env.VERSION }}
          description: "Copy ApexRadiance.asi into The Sims 3\\Game\\Bin\\ (needs an ASI loader). Full notes: https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG }}"
          changelog: ${{ env.CHANGELOG }}
          update_mod_version: true
          archive_existing_version: true

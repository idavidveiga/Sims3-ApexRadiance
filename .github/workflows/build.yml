name: Windows build and CPU checks
on:
  pull_request:
  push:
    branches: [main, 'experiment/lot-lod-400m-32-lots']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare pinned x86 static dependencies
        shell: pwsh
        run: ./tools/development/setup.ps1
      - name: Build standard 2.13.2-compatible ASI
        shell: pwsh
        run: ./tools/development/build.ps1 -Flavor Developer
      - name: Check codecs and CAS sorting
        shell: pwsh
        run: ./tools/development/check.ps1 -Suite Smoke
      - name: Preserve public build and check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ApexRadiance-standard-lod-experimental-${{ github.sha }}
          path: |
            Release/ApexRadiance.asi
            outputs/checks/*.txt
            outputs/build/cache/*/*.log
          if-no-files-found: warn
          retention-days: 14

name: Build Lot LOD Metric Probes

on:
  push:
    branches:
      - feature/lot-lod-streaming
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout streaming branch
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Prepare vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkg = "C:\vcpkg\vcpkg.exe"
          if (!(Test-Path $vcpkg)) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
          & $vcpkg install --triplet x86-windows-static --x-manifest-root="$env:GITHUB_WORKSPACE" --x-install-root="$env:GITHUB_WORKSPACE\vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build metric probe at stock LOD 70
        shell: pwsh
        run: |
          msbuild ApexRadiance.sln /t:Rebuild /m /p:Configuration=Release /p:Platform=x86 /p:VcpkgEnableManifest=false /p:ApexLotLodProbe=true /p:ApexLotLodTestValue=70
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "Release\ApexRadiance.asi")) { throw "Release\ApexRadiance.asi was not produced" }
          Copy-Item "Release\ApexRadiance.asi" "ApexRadiance_LotLodMetric70_TEST.asi"

      - name: Build metric probe at controlled LOD 100
        shell: pwsh
        run: |
          msbuild ApexRadiance.sln /t:Rebuild /m /p:Configuration=Release /p:Platform=x86 /p:VcpkgEnableManifest=false /p:ApexLotLodProbe=true /p:ApexLotLodTestValue=100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "Release\ApexRadiance.asi")) { throw "Release\ApexRadiance.asi was not produced" }
          Copy-Item "Release\ApexRadiance.asi" "ApexRadiance_LotLodMetric100_TEST.asi"

      - name: Upload metric probes
        uses: actions/upload-artifact@v4
        with:
          name: ApexRadiance-LotLodMetric-70-100-TEST
          path: |
            ApexRadiance_LotLodMetric70_TEST.asi
            ApexRadiance_LotLodMetric100_TEST.asi
          if-no-files-found: error

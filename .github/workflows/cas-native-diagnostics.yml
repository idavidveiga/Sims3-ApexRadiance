name: CAS native diagnostics

on:
  push:
    branches:
      - feature/cas-performance-native-only
    paths:
      - "features/cas_catalog_scheduler.h"
      - "features/cas_hair_grid_session.h"
      - "features/cas_hair_population_plan.h"
      - "features/cas_hair_native_bridge.h"
      - "features/cas_hair_sim_pump.h"
      - "features/cas_hair_sim_pump.cpp"
      - "tests/test_cas_hair_native_bridge.cpp"
      - "features/ts3_mono_xref.h"
      - "features/ts3_mono_method_identity.h"
      - "features/ts3_cas_mono_discovery.h"
      - "tests/test_ts3_cas_mono_discovery.cpp"
      - "tests/test_ts3_mono_method_identity.cpp"
      - "tests/test_ts3_mono_xref.cpp"
      - "features/ts3_mono_runtime_probe.cpp"
      - "features/ts3_cas_mono_sites.h"
      - "features/ts3_mono_host_snapshot.h"
      - "tests/test_ts3_mono_host_snapshot.cpp"
      - "tests/test_ts3_cas_mono_sites.cpp"
      - "framework/entry_chain.cpp"
      - "framework/entry_chain.h"
      - "features/fast_create_a_style.cpp"
      - "tests/test_mono_resolver_fails_closed.py"
      - "tests/test_cas_catalog_scheduler.cpp"
      - "tests/test_cas_hair_grid_session.cpp"
      - "tests/test_cas_hair_population_plan.cpp"
      - "tools/verify_hair_ui_contract.py"
      - "tests/test_verify_hair_ui_contract.py"
      - "research/temporary-hair-hats/TemporaryCasHairExperiment.cs"
      - "ApexRadiance.vcxproj"
      - "tools/inspect_ts3_executable.py"
      - "tests/test_inspect_ts3_executable.py"
      - ".github/workflows/cas-native-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-scheduler-and-pe-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test native C++ scheduler
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            -Ifeatures tests/test_cas_catalog_scheduler.cpp -o "${RUNNER_TEMP}/cas_scheduler_test"
          "${RUNNER_TEMP}/cas_scheduler_test"
      - name: Test native Hair/Hats grid lifecycle
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread \
            -Ifeatures tests/test_cas_hair_grid_session.cpp -o "${RUNNER_TEMP}/cas_hair_grid_test"
          "${RUNNER_TEMP}/cas_hair_grid_test"
      - name: Test original-order Hair/Hats phased work
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread \
            -Ifeatures tests/test_cas_hair_population_plan.cpp -o "${RUNNER_TEMP}/cas_hair_population_plan_test"
          "${RUNNER_TEMP}/cas_hair_population_plan_test"
      - name: Test native Hair/Hats game-thread callback adapter
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread \
            -Ifeatures tests/test_cas_hair_native_bridge.cpp -o "${RUNNER_TEMP}/cas_hair_native_bridge_test"
          "${RUNNER_TEMP}/cas_hair_native_bridge_test"
      - name: Test strict x86 MonoMethod identity gate
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            -Ifeatures tests/test_ts3_mono_method_identity.cpp -o "${RUNNER_TEMP}/cas_mono_method_identity_test"
          "${RUNNER_TEMP}/cas_mono_method_identity_test"
      - name: Test gated x86 Mono class and method discovery
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            -Ifeatures tests/test_ts3_cas_mono_discovery.cpp -o "${RUNNER_TEMP}/cas_mono_discovery_test"
          "${RUNNER_TEMP}/cas_mono_discovery_test"
      - name: Test bounded Mono CAS bridge-site evidence
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            -Ifeatures tests/test_ts3_cas_mono_sites.cpp -o "${RUNNER_TEMP}/ts3_cas_mono_sites_test"
          "${RUNNER_TEMP}/ts3_cas_mono_sites_test"
      - name: Test read-only Mono ScriptHost readiness
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            -Ifeatures tests/test_ts3_mono_host_snapshot.cpp -o "${RUNNER_TEMP}/ts3_mono_host_snapshot_test"
          "${RUNNER_TEMP}/ts3_mono_host_snapshot_test"
      - name: Test read-only x86 Mono candidate reference scanner
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            -Ifeatures tests/test_ts3_mono_xref.cpp -o "${RUNNER_TEMP}/ts3_mono_xref_test"
          "${RUNNER_TEMP}/ts3_mono_xref_test"
      - name: Test offline executable inspector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/inspect_ts3_executable.py tests/test_inspect_ts3_executable.py
          python3 -m unittest discover -s tests -p 'test_inspect_ts3_executable.py' -v
      - name: Test exact original Hair/Hats contract verifier and safe research gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_verify_hair_ui_contract.py' -v
      - name: Confirm EA 1.69 ICall signature rejection and read-only anchor inspection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mono_resolver_fails_closed.py' -v
      - name: Confirm no original EA executables are required
        shell: bash
        run: |
          test ! -f TS3.exe
          test ! -f TS3W.exe
